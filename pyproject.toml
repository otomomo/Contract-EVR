[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-evr"
version = "0.2.0"
description = "Auditable, project-configurable evidence verification runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.10", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["contract_evr*"]

[tool.setuptools.package-data]
contract_evr = ["schemas/*.json"]
